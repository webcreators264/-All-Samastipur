<!DOCTYPE html>
<html lang="hi">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<meta
  name="theme-color"
  content="#0756d9"
>

<title>Live Map | All Samastipur</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial,sans-serif;
  background:#f4f7fb;
  color:#172033;
}

header{
  background:#fff;
  padding:15px 6%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  box-shadow:0 2px 12px rgba(0,0,0,.08);
}

.logo{
  color:#0756d9;
  font-size:22px;
  font-weight:800;
}

.badge{
  background:#eaf3ff;
  color:#0756d9;
  padding:9px 13px;
  border-radius:20px;
  font-size:13px;
  font-weight:bold;
}

.container{
  max-width:1000px;
  margin:auto;
  padding:25px 18px;
}

h1{
  margin-bottom:8px;
}

.subtitle{
  color:#667085;
  margin-bottom:20px;
}

.card{
  background:#fff;
  padding:20px;
  border-radius:18px;
  box-shadow:0 5px 20px rgba(0,0,0,.07);
}

.map{
  width:100%;
  height:500px;
  border-radius:14px;
  overflow:hidden;
  background:#e5e7eb;
}

.controls{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-bottom:15px;
}

input{
  width:100%;
  padding:13px;
  border:1px solid #d9dee8;
  border-radius:9px;
  font-size:15px;
}

.btn{
  width:100%;
  padding:13px;
  border:0;
  border-radius:9px;
  background:#0756d9;
  color:#fff;
  font-weight:bold;
  cursor:pointer;
  margin-top:12px;
}

.info{
  margin-top:15px;
  padding:15px;
  background:#eef6ff;
  border-radius:10px;
  line-height:1.7;
}

.driver-status{
  margin-top:15px;
  padding:14px;
  background:#ecfdf3;
  color:#166534;
  border-radius:10px;
  font-weight:bold;
}

footer{
  text-align:center;
  padding:30px;
  color:#667085;
}

@media(max-width:700px){

  .controls{
    grid-template-columns:1fr;
  }

  .map{
    height:400px;
  }

}

</style>

</head>

<body>

<header>

  <div class="logo">
    🛺 All Samastipur
  </div>

  <div class="badge">
    📍 Live Map
  </div>

</header>


<div class="container">

  <h1>
    📍 Ride Map
  </h1>

  <p class="subtitle">
    Pickup, Drop और Driver Location देखें।
  </p>


  <div class="card">

    <div class="controls">

      <input
        type="text"
        id="pickup"
        placeholder="Pickup Location"
        value="Samastipur Station"
      >

      <input
        type="text"
        id="drop"
        placeholder="Drop Location"
        value="Tajpur"
      >

    </div>


    <button
      class="btn"
      onclick="showRoute()"
    >
      🗺️ Show Route
    </button>


    <div
      id="map"
      class="map"
      style="margin-top:15px;"
    ></div>


    <div class="info">

      <strong>
        📍 Pickup:
      </strong>

      <span id="pickupText">
        Samastipur Station
      </span>

      <br>

      <strong>
        🏁 Drop:
      </strong>

      <span id="dropText">
        Tajpur
      </span>

    </div>


    <div class="driver-status">

      🟢 Driver Status:
      <span id="driverStatus">
        Searching for nearby driver...
      </span>

    </div>

  </div>

</div>


<footer>

  🛺 <b>All Samastipur</b>

  <br>

  <small>
    Local Ride Booking Platform
  </small>

</footer>


<!-- ==========================================
     GOOGLE MAPS
========================================== -->

<script>

let map;

let pickupMarker;

let dropMarker;

let driverMarker;

let directionsService;

let directionsRenderer;


/*
=========================================
INITIALIZE GOOGLE MAP
=========================================
*/

function initMap(){

  const samastipur = {

    lat:25.8629,

    lng:85.7810

  };


  map =
    new google.maps.Map(

      document.getElementById("map"),

      {

        center:
          samastipur,

        zoom:
          13,

        mapTypeControl:
          false,

        streetViewControl:
          false,

        fullscreenControl:
          true

      }

    );


  window.allSamastipurMap =
    map;


  directionsService =
    new google.maps.DirectionsService();


  directionsRenderer =
    new google.maps.DirectionsRenderer({

      map:map

    });


  pickupMarker =
    new google.maps.Marker({

      position:
        samastipur,

      map:
        map,

      title:
        "Pickup Location",

      label:
        "P"

    });


  document.getElementById(
    "driverStatus"
  ).innerText =
    "Searching for driver...";


  console.log(
    "✅ Google Map Loaded"
  );

}


/*
=========================================
SHOW ROUTE
=========================================
*/

function showRoute(){

  const pickup =
    document.getElementById(
      "pickup"
    ).value.trim();


  const drop =
    document.getElementById(
      "drop"
    ).value.trim();


  if(!pickup || !drop){

    alert(
      "Pickup और Drop Location डालें।"
    );

    return;

  }


  document.getElementById(
    "pickupText"
  ).innerText =
    pickup;


  document.getElementById(
    "dropText"
  ).innerText =
    drop;


  if(!directionsService){

    alert(
      "Google Maps अभी load नहीं हुआ।"
    );

    return;

  }


  directionsService.route(

    {

      origin:
        pickup,

      destination:
        drop,

      travelMode:
        google.maps.TravelMode.DRIVING

    },

    function(result,status){

      if(
        status ===
        "OK"
      ){

        directionsRenderer.setDirections(
          result
        );

      }else{

        alert(
          "Route नहीं मिल पाया।"
        );

      }

    }

  );

}


/*
=========================================
FIREBASE LIVE DRIVER LOCATION
=========================================
*/

async function connectDriverLocation(){

  try{

    const module =
      await import(
        "./firebase-config.js"
      );


    const database =
      module.database;

    const ref =
      module.ref;

    const onValue =
      module.onValue;


    const savedRide =
      localStorage.getItem(
        "allSamastipurCurrentRide"
      );


    if(!savedRide){

      console.log(
        "Current ride नहीं मिली।"
      );

      return;

    }


    const ride =
      JSON.parse(
        savedRide
      );


    if(!ride.rideId){

      console.log(
        "Ride ID नहीं मिली।"
      );

      return;

    }


    const rideRef =
      ref(

        database,

        "rides/" +
        ride.rideId

      );


    onValue(

      rideRef,

      function(snapshot){

        if(!snapshot.exists()){

          return;

        }


        const data =
          snapshot.val();


        const location =
          data.driverLocation;


        if(
          !location ||
          location.latitude === null ||
          location.longitude === null
        ){

          document.getElementById(
            "driverStatus"
          ).innerText =
            "🔍 Driver location waiting...";

          return;

        }


        const position = {

          lat:
            Number(
              location.latitude
            ),

          lng:
            Number(
              location.longitude
            )

        };


        /*
        =====================================
        CREATE DRIVER MARKER
        =====================================
        */

        if(!driverMarker){

          driverMarker =
            new google.maps.Marker({

              position:
                position,

              map:
                map,

              title:
                "🚕 All Samastipur Driver"

            });

        }else{

          driverMarker.setPosition(
            position
          );

        }


        /*
        =====================================
        DRIVER STATUS
        =====================================
        */

        document.getElementById(
          "driverStatus"
        ).innerText =
          "🟢 Driver location live";


        /*
        =====================================
        CENTER MAP
        =====================================
        */

        map.panTo(
          position
        );


        console.log(
          "🚕 Driver Live:",
          position
        );

      }

    );


  }catch(error){

    console.error(
      "Firebase Map Error:",
      error
    );

  }

}


/*
=========================================
START FIREBASE AFTER MAP LOAD
=========================================
*/

function startLiveDriverTracking(){

  if(
    typeof google ===
      "undefined" ||
    !google.maps
  ){

    return;

  }


  connectDriverLocation();

}


</script>


<!-- ==========================================
     FIREBASE LIVE LOCATION START
========================================== -->

<script>

window.addEventListener(
  "load",
  function(){

    setTimeout(
      startLiveDriverTracking,
      1000
    );

  }
);

</script>


<!-- ==========================================
     GOOGLE MAPS SCRIPT
========================================== -->

<!--
IMPORTANT:

YOUR_GOOGLE_MAPS_API_KEY को अपनी
Google Maps API Key से replace करें।
-->

<script
  async
  defer
  src="https://maps.googleapis.com/maps/api/js?key=YOUR_GOOGLE_MAPS_API_KEY&callback=initMap">
</script>


</body>

</html>
