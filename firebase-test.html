<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>All Samastipur - Firebase Test</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 25px;
      text-align: center;
    }

    button {
      padding: 15px 25px;
      font-size: 18px;
      cursor: pointer;
    }

    #result {
      margin-top: 20px;
      padding: 15px;
      word-break: break-word;
    }
  </style>
</head>

<body>

  <h2>All Samastipur</h2>

  <p>Firebase Booking Test</p>

  <button id="testRide">
    Create Test Ride
  </button>

  <div id="result">
    Ready...
  </div>


  <script type="module">

    const result =
      document.getElementById("result");


    // Step 1: Check JavaScript

    result.innerText =
      "JavaScript Loaded...";


    try {

      // Step 2: Load booking system

      const module =
        await import("./ride-booking.js");


      result.innerText =
        "Firebase booking module loaded...";


      const bookRide =
        module.bookRide;


      if (!bookRide) {

        throw new Error(
          "bookRide function नहीं मिली"
        );

      }


      // Step 3: Button

      document
        .getElementById("testRide")
        .addEventListener(
          "click",
          async function () {

            result.innerText =
              "⏳ Firebase में booking भेजी जा रही है...";


            try {

              const ride =
                await bookRide({

                  customerName:
                    "Test Customer",

                  customerMobile:
                    "9999999999",

                  pickup:
                    "Samastipur Junction",

                  drop:
                    "Mithapur",

                  rideType:
                    "Auto Rickshaw",

                  passengers:
                    1,

                  fare:
                    50

                });


              result.innerText =
                "✅ SUCCESS!\n\n" +
                "Booking ID: " +
                ride.bookingId +
                "\n\n" +
                "Ride ID: " +
                ride.rideId;


            } catch (error) {

              console.error(error);

              result.innerText =
                "❌ FIREBASE ERROR\n\n" +
                error.message;

            }

          }
        );


    } catch (error) {

      console.error(error);

      result.innerText =
        "❌ JAVASCRIPT / FIREBASE LOAD ERROR\n\n" +
        error.message;

    }

  </script>

</body>

</html>
